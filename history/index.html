<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>History — Roast Archive</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090909;
        --panel: #151515;
        --line: #343434;
        --text: #f3eee7;
        --muted: #a49b90;
        --accent: #ff6b00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 32px 20px;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
      }

      .label {
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(34px, 7vw, 72px);
        line-height: 0.95;
        margin: 8px 0 24px;
      }

      .top {
        align-items: center;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      .button,
      .report {
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }

      .button {
        display: inline-flex;
        font-size: 13px;
        font-weight: 800;
        min-height: 40px;
        padding: 0 14px;
        align-items: center;
        text-transform: uppercase;
      }

      .button:hover,
      .report:hover {
        border-color: var(--accent);
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .report {
        background: var(--panel);
        display: grid;
        gap: 6px;
        padding: 18px;
      }

      .report strong {
        color: #ffbf36;
        font-size: 18px;
      }

      .report span {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <div>
          <div class="label">Archive history</div>
          <h1>Reports</h1>
        </div>
        <a class="button" href="/today/">Today</a>
      </div>
      <div class="list" id="list"></div>
    </main>
    <script>
      async function init() {
        const list = document.querySelector('#list');
        const response = await fetch('/reports.json', { cache: 'no-store' });
        const reports = response.ok ? await response.json() : [];
        reports
          .sort((a, b) => b.date.localeCompare(a.date))
          .forEach((report) => {
            const link = document.createElement('a');
            link.className = 'report';
            link.href = report.path;
            link.innerHTML = `<strong>${report.date}</strong><span>${report.title}</span>`;
            list.appendChild(link);
          });
      }

      init();
    </script>
  </body>
</html>
